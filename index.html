<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="google-site-verification" content="kX-1kjm8YL-7SQQsDPWwunBMPdDKY3MohHzaTwkA4ck" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Rate & Tip Calculator | Free Finance Toolkit</title>
  <meta name="description" content="Calculate your ideal freelance hourly rate and easily split tips and bills with our free online financial toolkit.">
  <meta name="keywords" content="freelance rate calculator, tip splitter, bill splitter, hourly rate finder, finance tools">
  <meta name="robots" content="index, follow">

  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M2BSNEQLT0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-M2BSNEQLT0');
</script>
</head>
<body>

  <div class="calculator-container">
    
    <h1>Freelance & Finance Toolkit</h1>

    <!-- Global Currency Selector -->
    <div class="currency-selector">
      <label for="currency-select">Select Currency: </label>
      <select id="currency-select">
        <option value="₹">₹ (INR - Indian Rupee)</option>
        <option value="$">$ (USD - US Dollar)</option>
        <option value="€">€ (EUR - Euro)</option>
        <option value="£">£ (GBP - British Pound)</option>
      </select>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-buttons">
      <button class="nav-btn active" data-tab="hourly-calculator">Hourly Rate</button>
      <button class="nav-btn" data-tab="tip-calculator">Tip Splitter</button>
      <button class="nav-btn" data-tab="compound-calculator">Compound Interest</button>
    </div>

    <!-- CALCULATOR 1: Freelance Rate Calculator -->
    <div id="hourly-calculator" class="calculator-card">
      <h2>Freelance Hourly Rate Calculator</h2>
      
      <label for="income">Target Monthly Income:</label>
      <input type="number" id="income" placeholder="e.g. 50000">

      <label for="expenses">Monthly Business Expenses:</label>
      <input type="number" id="expenses" placeholder="e.g. 5000">

      <label for="hours">Billable Hours Per Week:</label>
      <input type="number" id="hours" placeholder="e.g. 20">

      <button onclick="calculateRate()">Calculate Hourly Rate</button>

      <div class="result-box" id="rate-result">
        Enter your details above and click calculate.
      </div>
    </div>

    <!-- CALCULATOR 2: Tip & Bill Splitter -->
    <div id="tip-calculator" class="calculator-card" style="display: none;">
      <h2>Tip & Bill Splitter</h2>

      <label for="bill">Total Bill Amount:</label>
      <input type="number" id="bill" placeholder="e.g. 1500">

      <label for="tip-percent">Tip Percentage (%):</label>
      <input type="number" id="tip-percent" placeholder="e.g. 10">

      <label for="people">Number of People:</label>
      <input type="number" id="people" placeholder="e.g. 3">

      <button onclick="calculateTip()">Calculate Split</button>

      <div class="result-box" id="tip-result">
        Enter your bill details above and click calculate.
      </div>
    </div>

    <!-- Calculator 3: Compound Interest Calculator -->
    <div id="compound-calculator" class="calculator-card" style="display: none;">
      <h2>Compound Interest Calculator</h2>
  
  <div class="input-group">
    <label for="initial-deposit">Initial Investment ($):</label>
    <input type="number" id="initial-deposit" placeholder="e.g. 1000">
  </div>

  <div class="input-group">
    <label for="monthly-contribution">Monthly Contribution ($):</label>
    <input type="number" id="monthly-contribution" placeholder="e.g. 100">
  </div>

  <div class="input-group">
    <label for="interest-rate">Annual Interest Rate (%):</label>
    <input type="number" id="interest-rate" placeholder="e.g. 7" step="0.1">
  </div>

  <div class="input-group">
    <label for="investment-years">Investment Period (Years):</label>
    <input type="number" id="investment-years" placeholder="e.g. 10">
  </div>

  <button id="calc-interest-btn">Calculate Future Value</button>

  <div class="result-box" id="interest-result" style="display: none;">
    <p>Total Future Value: <strong id="total-value">$0.00</strong></p>
    <p>Total Interest Earned: <strong id="total-interest">$0.00</strong></p>
  </div>
</div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
